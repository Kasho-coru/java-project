# =============================================================================
# Spring Boot Application Properties
# Employee Responsibility Handover & Transition Management System
# =============================================================================

spring.application.name=employee-handover-backend
server.port=8080

# -----------------------------------------------------------------------------
# MySQL Database Configuration
# Supports local environment variables:
#   MYSQL_PASSWORD (mandatory or set locally by developer)
#   MYSQL_USER or MYSQL_USERNAME (defaults to 'root')
#   MYSQL_URL (defaults to localhost:3306/employee_handover)
# -----------------------------------------------------------------------------
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3307/employee_handover?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USERNAME:${MYSQL_USER:root}}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -----------------------------------------------------------------------------
# JPA / Hibernate Configuration
# -----------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# -----------------------------------------------------------------------------
# Logging Configuration
# -----------------------------------------------------------------------------
logging.level.com.handover=INFO
logging.level.org.springframework.web=INFO
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
